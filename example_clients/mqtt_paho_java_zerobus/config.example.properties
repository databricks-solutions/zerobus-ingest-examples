# Copy to config.properties (git-ignored) and replace the placeholders.
# Environment variables with the same names override these values.
# The service principal's client ID and secret are not stored here. Export
# DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET instead.

# Workspace URL, for the OAuth token request.
workspace.url=https://<workspace-url>
# Workspace ID, used in the token resource name.
workspace.id=<workspace-id>
# Target table in catalog.schema.table form.
table.name=<catalog>.<schema>.mqtt_paho_java
# Zerobus Ingest MQTT hostname, without https:// or a port. The port is always 8883.
mqtt.host=<workspace-id>.zerobus.<region>.<cloud-domain>

# Simulator settings.
sensor.device=sensor-1
sensor.records=20
sensor.interval.ms=1000
# Reconnect with a new token every N records. 0 turns this off.
sensor.reconnect.every=0

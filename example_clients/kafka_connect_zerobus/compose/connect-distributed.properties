# Kafka Connect worker (distributed mode) for the Zerobus sink. Service names: kafka and connect (docker compose network).
bootstrap.servers=kafka:9092
group.id=zerobus-kafka-connect
listeners=HTTP://0.0.0.0:8083
rest.advertised.host.name=connect

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=true

config.storage.topic=connect-configs
config.storage.replication.factor=1
offset.storage.topic=connect-offsets
offset.storage.replication.factor=1
status.storage.topic=connect-status
status.storage.replication.factor=1

# Commit interval. Short commits keep latency low; a commit flushes streams that have records in flight.
offset.flush.interval.ms=500

plugin.path=/opt/connect/plugins

# Connector configs use ${env:NAME}; the worker resolves them from its environment (from .env), so secrets
# never sit in config files or in the config topic.
config.providers=env
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider

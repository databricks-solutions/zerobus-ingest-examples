# Logstash pipeline for the Zerobus output. Placeholders only: replace the <...> values and keep
# the secrets in the environment or the Logstash keystore.
#
#   export DATABRICKS_CLIENT_ID=<client-id>
#   export DATABRICKS_CLIENT_SECRET=<client-secret>
#   bin/logstash-keystore create                        # once, before the first add
#   bin/logstash-keystore add DATABRICKS_CLIENT_SECRET  # optional: use the keystore instead
#
input {
  stdin { codec => json }
}

filter {
  mutate { remove_field => ["host", "event", "@version"] }
}

output {
  zerobus {
    workspace_url    => "<workspace-url>"
    zerobus_endpoint => "<workspace-id>.zerobus.<region>.cloud.databricks.com"
    table            => "<catalog>.<schema>.<table>"
    client_id        => "${DATABRICKS_CLIENT_ID}"
    client_secret    => "${DATABRICKS_CLIENT_SECRET}"
    batch_size       => 100
  }
}

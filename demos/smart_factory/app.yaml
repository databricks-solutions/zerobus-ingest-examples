command: ["uvicorn", "src.app:app", "--host", "0.0.0.0", "--port", "8000"]

env:
  - name: CATALOG_NAME
    value: main
  - name: LANDING_SCHEMA
    value: smartfactory
  - name: ZEROBUS_TABLE
    value: main.smartfactory.raw_sensor_events
  - name: WAREHOUSE_ID
    value: ""
  - name: PIPELINE_SCHEMA
    value: smartfactory
  - name: PIPELINE_ID
    value: ""
  - name: ENABLE_SIMULATOR
    value: "false"
  - name: SIMULATOR_INTERVAL_MS
    value: "1000"

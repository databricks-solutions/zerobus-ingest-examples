bundle:
  name: smartfactory-demo

sync:
  include:
    - app.yaml
    - .generated/**

variables:
  warehouse_id:
    description: "SQL Warehouse ID for dashboard queries"
  catalog_name:
    description: "Unity Catalog name"
  schema_name:
    description: "Landing and pipeline schema name"

resources:
  schemas:
    smartfactory_schema:
      name: ${var.schema_name}
      catalog_name: ${var.catalog_name}
      comment: "SmartFactory IoT demo — all pipeline tables"

  pipelines:
    smartfactory_sdp:
      name: "smartfactory-sdp-pipeline"
      catalog: ${var.catalog_name}
      target: ${var.schema_name}
      serverless: true
      libraries:
        - file:
            path: .generated/pipeline/bronze.sql
        - file:
            path: pipeline/silver.sql
        - file:
            path: pipeline/gold.sql
      channel: PREVIEW
      continuous: true

  apps:
    smartfactory_app:
      name: "smartfactory-app"
      description: "SmartFactory IoT demo — ZeroBus + SDP streaming with anomaly detection"
      source_code_path: .

  dashboards:
    smartfactory_dashboard:
      display_name: "SmartFactory Health Dashboard"
      file_path: .generated/dashboards/smartfactory.lvdash.json
      warehouse_id: ${var.warehouse_id}

targets:
  dev:
    default: true
    mode: development

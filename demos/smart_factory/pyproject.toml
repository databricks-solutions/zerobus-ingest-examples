[project]
name = "smartfactory-demo"
version = "0.1.0"
description = "SmartFactory IoT demo — ZeroBus + SDP streaming with anomaly detection"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "databricks-sdk>=0.61.0",
    "pydantic>=2.1.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
